name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # go (gitleaks hook) and jq (lint.openwrt) come with the ubuntu runner,
  # uvx runs ruff and pre-commit at the versions pinned in the Makefile.
  # shellcheck is pinned instead of the runner's package: the findings
  # differ between releases, the pin keeps CI and the workstations on the
  # same ruleset
  lint:
    runs-on: ubuntu-latest
    env:
      SHELLCHECK_VERSION: 0.11.0
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0

      - name: install shellcheck
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | sudo tar -xJ --strip-components=1 -C /usr/local/bin "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          shellcheck --version

      - name: lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install chezmoi for template tests
        working-directory: ${{ runner.temp }}
        env:
          CHEZMOI_VERSION: 2.74.2
          CHEZMOI_SHA256: 5f2024119a1860f18f2243b892dd43a79f0fefe2ebef9786ee143f4d5fd69ccb
        run: |
          archive="chezmoi_${CHEZMOI_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/twpayne/chezmoi/releases/download/v${CHEZMOI_VERSION}/$archive"
          echo "$CHEZMOI_SHA256  $archive" | sha256sum --check
          mkdir -p chezmoi-bin
          tar -xzf "$archive" -C chezmoi-bin chezmoi
          ./chezmoi-bin/chezmoi --version
          echo "$RUNNER_TEMP/chezmoi-bin" >> "$GITHUB_PATH"

      - name: test
        run: make test
