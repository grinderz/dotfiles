# iwd on the linux laptop; managed by pyinfra (infra/deploys/systemd.py)
[Scan]
# After a resume from s2idle the mt7921e drops its association and the
# first scans come back empty, so iwd falls into periodic scans at 10,
# 20, 40 s and finds the AP only on the second one (+37 s). A shorter
# start (2, 4, 8, 16 s) gets it at about +10 s. The interval only runs
# while disconnected and still doubles up to the default 300 s.
InitialPeriodicScanInterval=2
