# Number-based retention only fills up on pacman transactions (snap-pac);
# hourly runs are mostly no-ops, and each real cleanup rewrites limine.conf
# and rsyncs both boot sticks. Daily is enough.
#
# The empty assignment resets ALL upstream timer expressions (systemd.timer:
# monotonic and calendar alike), so OnBootSec must be re-declared — without
# it OnUnitActiveSec never gets a first activation to count from and the
# timer goes dead (NextElapse=infinity).
[Timer]
OnUnitActiveSec=
OnBootSec=10m
OnUnitActiveSec=1d
