# Drop the compiled-in fallback resolvers (Quad9/Cloudflare/Google). An empty
# assignment resets the list; without it resolved silently leaks queries to
# those public servers whenever a link hands out no DNS of its own, which
# bypasses the LAN resolver and its split-horizon names.
# Trade-off: a network that provides no DNS now fails to resolve instead of
# falling back. Set DNS= here if a global default is ever wanted.
[Resolve]
FallbackDNS=
