## oama: XOAUTH2 token helper for the gmail-oauth mail accounts.
## Secrets stay in pass (fetched through pass-cache, same day-long
## kernel-keyring cache as the mail passwords); refresh/access tokens
## live in the Secret Service keyring — gnome-keyring is PAM-unlocked at
## login, so background token refreshes never hit a pinentry.

encryption:
    tag: KEYRING

services:
  google:
    client_id_cmd: |
      ~/.local/bin/pass-cache show oauth/google/client-id
    client_secret_cmd: |
      ~/.local/bin/pass-cache show oauth/google/client-secret
