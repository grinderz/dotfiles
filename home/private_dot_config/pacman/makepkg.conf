# User-level makepkg settings, read after /etc/makepkg.conf.
#
# Left alone, makepkg puts its work next to the PKGBUILD: downloaded sources
# and VCS clones (SRCDEST), the src/ and pkg/ trees (BUILDDIR) and the built
# package (PKGDEST). For the own PKGBUILDs in ~/src/personal/aur that is a
# checkout the backup takes, so there all three go to the cache, which no
# snapshot holds (~/.cache is a link into ~/.unbacked). It applies however
# the build is started: `aur -S <package>`, `yay -B <dir>` or makepkg by hand.
#
# Only there, on purpose. The AUR builds yay runs happen in
# ~/.cache/yay/<package>, outside the snapshots already, and `yay -Sc` cleans
# what they leave in that directory; it knows nothing of these three, so
# sent here their sources and packages would pile up with every update.
#
# makepkg sets startdir (pwd -P) before it reads this file.
case "${startdir:-$PWD}/" in
    "$HOME"/src/personal/aur/*)
        SRCDEST="${XDG_CACHE_HOME:-$HOME/.cache}/makepkg/sources"
        PKGDEST="${XDG_CACHE_HOME:-$HOME/.cache}/makepkg/packages"
        BUILDDIR="${XDG_CACHE_HOME:-$HOME/.cache}/makepkg/build"
        ;;
esac
