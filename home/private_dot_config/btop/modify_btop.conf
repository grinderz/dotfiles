#!/bin/sh
# btop writes btop.conf back on every exit (save_config_on_exit), so a
# plain managed file would drift after the first run. chezmoi hands the
# current file on stdin; only the theme line is pinned, everything btop
# chose to remember stays. A missing file starts as just that line — btop
# fills in the rest on its first exit.
awk -v theme='color_theme = "tokyonight_storm"' '
    /^color_theme[[:space:]]*=/ { print theme; seen = 1; next }
    { print }
    END { if (!seen) print theme }
'
