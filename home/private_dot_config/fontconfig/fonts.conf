<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <!-- Sites asking for Windows UI fonts (reddit etc.) otherwise land on
         Adwaita Sans via the system-ui alias; keep Adwaita for the GTK UI
         but give the web a plain grotesque instead -->
    <match target="pattern">
        <test name="family"><string>Segoe UI</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Noto Sans</string></edit>
    </match>
</fontconfig>
