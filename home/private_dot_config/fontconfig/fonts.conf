<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <!-- Sites asking for Windows UI fonts (reddit etc.) otherwise land on
         Adwaita Sans via the system-ui alias; keep Adwaita for the GTK UI
         but give the web a plain grotesque instead -->
    <match target="pattern">
        <test name="family"><string>Segoe UI</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Noto Sans</string></edit>
    </match>

    <!-- Pin the generic monospace (foot, sway fallback, web CSS) to the
         current resolution so future font installs cannot flip it;
         missing glyphs (nerd icons) still come via fallback -->
    <alias>
        <family>monospace</family>
        <prefer><family>Noto Sans Mono</family></prefer>
    </alias>
</fontconfig>
