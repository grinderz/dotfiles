[general]
import = [
    "~/.config/alacritty/themes/themes/kitty.toml"
]

[font]
size = 15.25
#normal = { family = "JetBrainsMono Nerd Font Mono", style = "Regular" }
#normal = { family = "VictorMono Nerd Font Mono", style = "Regular" }
#normal = { family = "Agave Nerd Font Mono", style = "Regular" }
#normal = { family = "GeistMono Nerd Font Mono", style = "Regular" }
#normal = { family = "Hack Nerd Font Mono", style = "Regular" }
#normal = { family = "MesloLGM Nerd Font Mono", style = "Regular" }
#normal = { family = "ProFontWindows Nerd Font Mono", style = "Regular" }
#normal = { family = "SauceCodePro Nerd Font Mono", style = "Regular" }
normal = { family = "SpaceMono Nerd Font Mono", style = "Regular" }

[window]
option_as_alt = "Both"

# explicit: Alacritty otherwise takes $SHELL from the login session, which
# still says zsh when the login shell was changed after logging in
[terminal.shell]
program = "/opt/homebrew/bin/fish"
args = ["-l"]

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

# Karabiner swaps Cmd and Ctrl on the external keyboard (the physical Super
# drives AeroSpace as ctrl, the physical Ctrl carries the app shortcuts,
# Linux-style Ctrl+C/V). The terminal then sees Cmd where the shell expects
# Ctrl, and it must stay that way: AeroSpace grabs its ctrl keys globally,
# a real ctrl+r here would open resize mode instead of the history search.
# So every Cmd+<key> below is sent as the control character it would be on
# Linux. Copy and paste sit on Cmd+Shift+C/V (physically Ctrl+Shift+C/V,
# foot's keys) and on Ctrl+Shift+C/V for the builtin keyboard; Cmd+=/-
# keep the default font zoom, like foot's Ctrl+plus/minus.

[[keyboard.bindings]]
key = "A"
mods = "Command"
chars = "\u0001"

