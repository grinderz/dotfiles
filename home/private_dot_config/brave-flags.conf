# Chromium flags read by brave-bin's launcher, one per line.

# Pin native Wayland (ozone) regardless of upstream default changes
--ozone-platform-hint=auto

# TouchpadOverscrollHistoryNavigation: two-finger swipe = history back/forward
# AcceleratedVideoDecodeLinuxGL: VA-API hardware video decode (mesa radeonsi);
# verify at brave://gpu -> Video Decode: Hardware accelerated
--enable-features=TouchpadOverscrollHistoryNavigation,AcceleratedVideoDecodeLinuxGL
