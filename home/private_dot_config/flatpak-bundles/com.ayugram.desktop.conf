# flatpak-bundle-update source for com.ayugram.desktop. Sourced by bash:
#   releases     releases API of the project that publishes the bundle;
#                GitHub shape (tag_name, body, assets[].name/size/
#                browser_download_url), which Gitea, Forgejo and Codeberg
#                share
#   version_sed  sed expression turning the tag into the app version
#                (default: strip a leading v)
#   asset        glob picking the bundle among the release assets
#                (default *.flatpak)
#   changelog    optional URL of a changelog whose entries start with the
#                version; {version} is replaced by the new one, printing
#                stops at the installed version's entry
#
# AyuGram is not on Flathub. 0FL01/AyuGramDesktop-flatpak is a CI-only
# fork of the upstream repo: it builds every upstream tag and publishes
# ayugram-desktop-<version>.flatpak in a release tagged
# flatpak-v<version>-<build timestamp>. Upstream's changelog.txt is the
# Telegram Desktop one with AyuGram on top.
releases=https://api.github.com/repos/0FL01/AyuGramDesktop-flatpak/releases?per_page=20
version_sed='s/^flatpak-v([^-]+).*/\1/'
asset='ayugram-desktop-*.flatpak'
changelog='https://raw.githubusercontent.com/AyuGram/AyuGramDesktop/v{version}/changelog.txt'
