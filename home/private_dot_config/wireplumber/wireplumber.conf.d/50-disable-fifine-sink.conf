# The fifine USB microphone exposes a playback sink (headphone jack) that
# keeps getting picked as the default output. Disable its output node so
# only its capture side is used.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_output.usb-fifine_Microphones_fifine_Microphone_REV1.0-00.analog-stereo"
      }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
